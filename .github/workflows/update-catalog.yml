name: Refresh release catalog
on:
  release:
    types: [published, edited, deleted, unpublished, released]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build_catalog.py
      - name: Publish download metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public release catalog"
            git push origin HEAD:main
          fi
